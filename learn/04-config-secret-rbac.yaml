# The Secret `web-secret` is created by command (never committed):
#   kubectl -n learn create secret generic web-secret --from-literal=api-token="$(openssl rand -hex 8)"
apiVersion: v1
kind: ConfigMap
metadata: {name: web-config, namespace: learn}
data: {GREETING: "hello-v1"}
---
apiVersion: v1
kind: Pod
metadata: {name: config-demo, namespace: learn, labels: {lab: "04"}}
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["pause"]
    env:
    - {name: LITERAL_PASSWORD, value: "visible-in-pod-spec"}           # anti-pattern, on purpose
    - name: GREETING_ENV
      valueFrom: {configMapKeyRef: {name: web-config, key: GREETING}}
    - name: API_TOKEN
      valueFrom: {secretKeyRef: {name: web-secret, key: api-token}}   # spec shows only the reference
    volumeMounts: [{name: cfg, mountPath: /etc/cfg}]
  volumes: [{name: cfg, configMap: {name: web-config}}]
---
# The real read-only RBAC from D-007, tried out here
apiVersion: v1
kind: ServiceAccount
metadata: {name: analyzer-readonly, namespace: learn}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: analyzer-readonly}
rules:
- apiGroups: [""]
  resources: [namespaces, nodes, events]
  verbs: [get, list, watch]
- apiGroups: ["apps"]
  resources: [deployments, replicasets, statefulsets, daemonsets]
  verbs: [get, list, watch]
- apiGroups: ["autoscaling"]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
- apiGroups: ["events.k8s.io"]
  resources: [events]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: analyzer-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: analyzer-readonly}
subjects: [{kind: ServiceAccount, name: analyzer-readonly, namespace: learn}]
