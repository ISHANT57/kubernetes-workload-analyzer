# QoS classes: decided by how requests/limits are set
apiVersion: v1
kind: Pod
metadata: {name: qos-besteffort, namespace: learn, labels: {lab: "03"}}
spec:
  containers:
  - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: ["pause"]}   # no requests/limits
---
apiVersion: v1
kind: Pod
metadata: {name: qos-burstable, namespace: learn, labels: {lab: "03"}}
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["pause"]
    resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 64Mi}}          # request < limit
---
apiVersion: v1
kind: Pod
metadata: {name: qos-guaranteed, namespace: learn, labels: {lab: "03"}}
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["pause"]
    resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 50m, memory: 32Mi}} # request = limit
---
# OOM: allocates 200Mi against a 64Mi limit → kernel OOM-kills the container
apiVersion: v1
kind: Pod
metadata: {name: oom, namespace: learn, labels: {lab: "03"}}
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["stress", "--mem-total=200Mi", "--mem-alloc-size=1Mi", "--mem-alloc-sleep=10ms"]
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 64Mi}}
---
# CPU throttling: wants 1 full CPU, limit allows 200m
apiVersion: v1
kind: Pod
metadata: {name: throttled, namespace: learn, labels: {lab: "03"}}
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["stress", "--cpus=1"]
    resources: {requests: {cpu: 100m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
---
# Scheduling failure 1: asks for more CPU than the node has (12)
apiVersion: v1
kind: Pod
metadata: {name: pending-cpu, namespace: learn, labels: {lab: "03"}}
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    args: ["pause"]
    resources: {requests: {cpu: "64"}}
---
# Scheduling failure 2: requires a node label that doesn't exist yet
apiVersion: v1
kind: Pod
metadata: {name: pending-selector, namespace: learn, labels: {lab: "03"}}
spec:
  nodeSelector: {disktype: ssd}
  containers:
  - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: ["pause"]}
