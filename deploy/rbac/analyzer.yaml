# D-007 ClusterRole for the analyzer backend, for in-cluster deployment (Phase 7).
#
# This is the *exact* rule set verified end-to-end in Phase 1 Lab 04
# (learn/04-config-secret-rbac.yaml, ServiceAccount `analyzer-readonly`): get/list/watch only, on
# namespaces, nodes, deployments, replicasets, statefulsets, daemonsets,
# horizontalpodautoscalers and events. No pods, no secrets, no configmaps, no write verb
# anywhere. See docs/decisions/ADR-007-k8s-api-scope.md.
#
# Phase 7 re-verified this scope directly (not just Lab 04's standalone test): the real
# in-cluster analyzer Deployment (deploy/analyzer/) runs as this ServiceAccount and successfully
# produces findings using only these permissions -- `kubectl auth can-i --list
# --as=system:serviceaccount:analyzer:analyzer` and a live pod-exec check both confirm pods/
# secrets/configmaps/writes are Forbidden.
apiVersion: v1
kind: Namespace
metadata:
  name: analyzer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analyzer
  namespace: analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: analyzer-readonly
rules:
- apiGroups: [""]
  resources: [namespaces, nodes, events]
  verbs: [get, list, watch]
- apiGroups: ["apps"]
  resources: [deployments, replicasets, statefulsets, daemonsets]
  verbs: [get, list, watch]
- apiGroups: ["autoscaling"]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
- apiGroups: ["events.k8s.io"]
  resources: [events]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: analyzer-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: analyzer-readonly
subjects:
- kind: ServiceAccount
  name: analyzer
  namespace: analyzer
