apiVersion: apps/v1
kind: Deployment
metadata: {name: hpa-demo, namespace: learn, labels: {app: hpa-demo}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hpa-demo}}
  template:
    metadata: {labels: {app: hpa-demo}}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/e2e-test-images/resource-consumer:1.15.0
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 400m, memory: 64Mi}
          limits: {cpu: "1", memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: hpa-demo, namespace: learn}
spec:
  selector: {app: hpa-demo}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hpa-demo, namespace: learn}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-demo}
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
# Load: ~300m total, shared by the Service across replicas
apiVersion: v1
kind: Pod
metadata: {name: load, namespace: learn, labels: {lab: "05"}}
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    command: ["/bin/sh", "-c"]
    args: ["while true; do for i in 1 2 3; do curl -s -X POST 'http://hpa-demo:8080/ConsumeCPU?millicores=100&durationSec=30' >/dev/null; done; sleep 30; done"]
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
