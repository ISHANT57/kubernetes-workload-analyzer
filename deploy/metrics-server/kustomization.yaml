apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml   # pinned version
patches:
- target: {kind: Deployment, name: metrics-server, namespace: kube-system}
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --kubelet-insecure-tls    # kind only: kubelet certs are self-signed
